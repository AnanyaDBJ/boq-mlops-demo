new_cluster: &new_cluster
  new_cluster:
    num_workers: 3
    spark_version: 15.3.x-cpu-ml-scala2.12
    node_type_id: i3.xlarge
    data_security_mode: "SINGLE_USER"
    custom_tags:
      clusterSource: mlops-stacks_0.4

common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    feature_engineering_job:
      name: ${bundle.target}-boq-loan-mlops-feature-engineering-job
      job_clusters:
        - job_cluster_key: feature_engineering_job_cluster
          <<: *new_cluster
      tasks:
        - task_key: AccountFeatures
          job_cluster_key: feature_engineering_job_cluster
          notebook_task:
            notebook_path: ../feature_engineering/notebooks/GenerateAndWriteFeatures.py
            base_parameters:
              input_table_path: ${var.catalog_name}.${var.schema_name}.account_master
              input_start_date: ""
              input_end_date: ""
              timestamp_column: ""
              output_table_name: ${var.catalog_name}.${var.schema_name}.account_features
              features_transform_module: account_features
              primary_keys: account_id
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}

        - task_key: DelinquencyFeatures
          job_cluster_key: feature_engineering_job_cluster
          notebook_task:
            notebook_path: ../feature_engineering/notebooks/GenerateAndWriteFeatures.py
            base_parameters:
              input_table_path: ${var.catalog_name}.${var.schema_name}.delinquency_history
              input_start_date: ""
              input_end_date: ""
              timestamp_column: ""
              output_table_name: ${var.catalog_name}.${var.schema_name}.delinquency_features
              features_transform_module: delinquency_features
              primary_keys: account_id
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}

        - task_key: PaymentFeatures
          job_cluster_key: feature_engineering_job_cluster
          notebook_task:
            notebook_path: ../feature_engineering/notebooks/GenerateAndWriteFeatures.py
            base_parameters:
              input_table_path: ${var.catalog_name}.${var.schema_name}.payment_behavior
              input_start_date: ""
              input_end_date: ""
              timestamp_column: ""
              output_table_name: ${var.catalog_name}.${var.schema_name}.payment_features
              features_transform_module: payment_features
              primary_keys: account_id
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}

      schedule:
        quartz_cron_expression: "0 0 7 * * ?" # daily at 7am
        timezone_id: UTC
      <<: *permissions
      # If you want to turn on notifications for this job, please uncomment the below code,
      # and provide a list of emails to the on_failure argument.
      #
      #  email_notifications:
      #    on_failure:
      #      - first@company.com
      #      - second@company.com
