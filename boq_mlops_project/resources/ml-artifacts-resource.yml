# Allow users to read the experiment 
common_permissions: &permissions
  permissions:
    - level: CAN_READ
      group_name: users

# Allow users to execute models in Unity Catalog
grants: &grants
  grants:
    - privileges:
        - EXECUTE
      principal: account users

# Defines model and experiments
resources:
  registered_models:
      model:
        name: ${var.model_name}
        catalog_name: ${var.catalog_name}
        schema_name: ${var.schema_name}
        comment: Home Loan Default Prediction Model (12-month PD) for BOQ/ME Bank - ${bundle.target} environment.
        <<: *grants

  experiments:
    experiment:
      name: ${var.experiment_name}
      <<: *permissions
      description: MLflow Experiment for Home Loan Default Prediction (boq-loan-mlops project).
